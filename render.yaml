# Render Blueprint — free static site built from the `rebuild` branch.
# The legacy Dash service (atlas-of-olympians.onrender.com, branch main) is not part of this Blueprint.
services:
  - type: web
    name: atlas-of-olympians-rebuild
    runtime: static
    branch: rebuild
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /img/*
        name: Cache-Control
        value: public, max-age=3600
